<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다시, 지구 — 텍스트 인생 시뮬레이션</title>
<meta name="description" content="올해 지구에서 태어나는 아기 중 한 명으로 뽑혀, 태어나서 죽을 때까지를 3분 동안 살아 보는 텍스트 인생 시뮬레이션.">
<meta property="og:title" content="다시, 지구 — 텍스트 인생 시뮬레이션">
<meta property="og:description" content="올해 지구에서 태어나는 아기 약 1억 3천만 명 가운데 한 명으로 뽑혀, 태어나서 죽을 때까지를 3분 동안 살아 보세요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sigco3111.github.io/dashi-jigu/">
<meta property="og:image" content="https://sigco3111.github.io/dashi-jigu/docs/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b1020">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="scr-start" class="screen">
    <div class="hero">
      <h1>다시, 지구</h1>
      <p class="tagline">올해 지구에서 태어나는 아기는 약 1억 3천만 명.<br>그중 한 명이 당신입니다.</p>
      <div id="era-row" aria-label="태어날 시대">
        <button class="era-btn active" data-era="now">올해</button>
        <button class="era-btn" data-era="2000">2000년</button>
        <button class="era-btn" data-era="1980">1980년</button>
        <button class="era-btn" data-era="1960">1960년</button>
      </div>
      <button id="btn-born" class="btn big">태어나기</button>
      <button id="btn-archive" class="btn ghost">지난 생애</button>
    </div>
    <p class="credit">데이터: 세계은행 세계개발지표 WDI (CC BY 4.0)</p>
  </section>

  <section id="scr-birth" class="screen hidden">
    <canvas id="cv-birth" width="800" height="800"></canvas>
    <div id="birth-panel" class="panel hidden">
      <p class="kicker">태어났습니다</p>
      <h2 id="b-country"></h2>
      <p id="b-detail"></p>
      <p id="b-name" class="name-line"></p>
      <p id="b-rarity" class="dim"></p>
      <button id="btn-live" class="btn big">이 삶을 살기</button>
    </div>
  </section>

  <section id="scr-life" class="screen hidden">
    <div id="hud"></div>
    <div id="stage-card" class="panel">
      <p id="st-age" class="kicker"></p>
      <h2 id="st-title"></h2>
      <p id="st-text"></p>
      <div id="st-choices"></div>
    </div>
    <div id="death-overlay" class="overlay hidden">
      <div class="panel">
        <p class="kicker">생을 마쳤습니다</p>
        <p id="d-text"></p>
        <div id="d-report"></div>
        <p class="dim arch-save-note">이 생애는 '지난 생애'에 기록되었습니다.</p>
        <button id="btn-card" class="btn big">인생 지도 보기</button>
      </div>
    </div>
    <div id="event-overlay" class="overlay hidden">
      <div class="panel">
        <p class="kicker" id="e-kicker">일어난 일</p>
        <h3 id="e-title"></h3>
        <p id="e-chain" class="dim"></p>
        <p id="e-text"></p>
        <p id="e-fx" class="dim"></p>
        <button id="btn-event-ok" class="btn big">계속</button>
      </div>
    </div>
  </section>

  <section id="scr-card" class="screen hidden">
    <canvas id="cv-card" width="1000" height="1250"></canvas>
    <div class="btnrow">
      <button id="btn-save" class="btn">이미지 저장</button>
      <button id="btn-share" class="btn">링크 복사</button>
    </div>
    <div class="btnrow">
      <button id="btn-again" class="btn big">다시 태어나기</button>
      <button id="btn-home" class="btn ghost">처음으로</button>
    </div>
  </section>

  <section id="scr-archive" class="screen hidden">
    <h2 class="arch-title">지난 생애</h2>
    <p class="dim arch-note">기록은 이 브라우저에만 저장됩니다.</p>
    <div id="arch-stamps"></div>
    <div id="arch-list"></div>
    <button id="btn-arch-back" class="btn ghost">돌아가기</button>
  </section>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
